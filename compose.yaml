services:
  pipxiv:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PIPXIV_CACHE_DIR: /app/data/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    volumes:
      - pipxiv_data:/app/data

volumes:
  pipxiv_data:
